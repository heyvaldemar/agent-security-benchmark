# Keeps the pinned GitHub Actions current. Images, CLI tools and the
# boundaries' releases are pinned by digest, hash or tag in files Dependabot
# does not read (tools.lock, ci-images.pins, sources.lock); they are moved by
# hand, with the new hash checked against the publisher's.
#
# Grouped: one pull request per week is a queue that gets read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
