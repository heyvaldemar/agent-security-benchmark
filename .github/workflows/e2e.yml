name: Benchmark e2e

# The suite through each boundary as it was released, on kind, on a GitHub
# runner. The calibration, at the sandbox's boundary, with two models that
# hold no weights (docs/decisions/0003); one job per open model at each of
# the three boundaries (docs/decisions/0001); and one job that makes the
# run's record.

on:
  push:
    branches: [main]
    # A change to words alone runs the static checks (Verify), not clusters.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      legs:
        description: "Which legs to run"
        type: choice
        options: [all, calibration, sandbox, flagship, cypress]
        default: all
      models:
        description: "The models, as a JSON list"
        type: string
        default: '["granite-4.0-1b", "qwen3.5-2b", "ministral-3-3b"]'

permissions:
  contents: read

# On main a run in progress is never cut short by the next one: a full
# matrix is hours of runners, and a run that was cut short has no record. The
# next run waits its turn. Elsewhere the newest run is the one that matters.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  repo:
    name: Public or private
    # Asked of the API, so the answer does not depend on what an event
    # carries. What depends on it is whether open models run without being
    # asked for, and whether a record is signed into a public transparency log.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - name: Ask
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)"
          echo "this repository is $visibility"
          if [ "$visibility" = public ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi

  calibration:
    name: The instrument, shown both ends
    if: github.event_name != 'workflow_dispatch' || inputs.legs == 'all' || inputs.legs == 'calibration'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: The sandbox's release, verified as a stranger would
        run: ./scripts/sources.sh sandbox

      - name: No swap, as the sandbox's own run requires
        run: |
          echo "before:"; cat /proc/swaps
          sudo swapoff -a
          echo "after:"; cat /proc/swaps

      - name: Create the cluster from the release's own config
        run: kind create cluster --config .cache/sources/sandbox/src/kind/cluster.yaml --wait 120s

      - name: gVisor and the sandbox, by the release's own scripts
        run: ./scripts/up.sh sandbox

      - name: The release's own checks, on this runner, before anything is added
        working-directory: .cache/sources/sandbox/src
        run: ./tests/e2e/run.sh

      - name: Beside it, the model's namespace and the outside
        run: ./scripts/up.sh beside sandbox

      - name: A model that acts on every plant, and a door planted open
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e/e2e-results-sandbox-obedient.json
        run: ./tests/e2e/run.sh sandbox obedient

      - name: A model that acts on none
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e/e2e-results-sandbox-deaf.json
        run: ./tests/e2e/run.sh sandbox deaf

      - name: One record of the run
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/e2e"
          legs=(out/*/*/leg.json)
          if [ ${#legs[@]} -gt 0 ]; then
            python3 scripts/read.py merge "${legs[@]}" > "$RUNNER_TEMP/e2e/results.json"
            cp -R out "$RUNNER_TEMP/e2e/out"
          fi
          ls -l "$RUNNER_TEMP/e2e"

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n agents get jobs || true
          kubectl -n models logs deployment/llama --tail=20 || true
          kubectl -n outside logs deployment/collector --tail=20 || true
          kubectl -n mcp logs deployment/mcp-server --tail=20 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-calibration
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  sandbox:
    name: The sandbox's boundary (${{ matrix.model }})
    # An open model takes a runner of its own. On a public repository these run
    # on a push to main and on the schedule; while it is private, and on a pull
    # request, by hand only, and the calibration is what runs.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.legs == 'all' || inputs.legs == 'sandbox'))
      || ((github.event_name == 'push' || github.event_name == 'schedule') && needs.repo.outputs.public == 'true')
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["granite-4.0-1b", "qwen3.5-2b", "ministral-3-3b"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The runner
        run: |
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)"
          echo "cpu: ${cpu:-unknown}, $(nproc) vCPU"

      - name: Room for a model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: The sandbox's and the flagship's releases, verified as a stranger would
        run: ./scripts/sources.sh sandbox flagship

      - name: No swap, as the sandbox's own run requires
        run: |
          sudo swapoff -a
          cat /proc/swaps

      - name: Create the cluster from the release's own config
        run: kind create cluster --config .cache/sources/sandbox/src/kind/cluster.yaml --wait 120s

      - name: gVisor and the sandbox, by the release's own scripts
        run: ./scripts/up.sh sandbox

      - name: The release's own checks, on this runner, before anything is added
        working-directory: .cache/sources/sandbox/src
        run: ./tests/e2e/run.sh

      - name: Beside it, the model's namespace and the outside
        run: ./scripts/up.sh beside sandbox

      - name: The suite, with the model deciding
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e/e2e-results-sandbox-${{ matrix.model }}.json
          MODEL: ${{ matrix.model }}
        run: ./tests/e2e/run.sh sandbox "$MODEL"

      - name: One record of the run
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/e2e"
          legs=(out/*/*/leg.json)
          if [ ${#legs[@]} -gt 0 ]; then
            python3 scripts/read.py merge "${legs[@]}" > "$RUNNER_TEMP/e2e/results.json"
            cp -R out "$RUNNER_TEMP/e2e/out"
          fi
          ls -l "$RUNNER_TEMP/e2e"

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n models describe pod -l app.kubernetes.io/name=llama | tail -40 || true
          kubectl -n models logs deployment/llama --all-containers --tail=30 || true
          kubectl -n agents get jobs || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-sandbox-${{ matrix.model }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  flagship:
    name: The flagship's boundary (${{ matrix.model }})
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.legs == 'all' || inputs.legs == 'flagship'))
      || ((github.event_name == 'push' || github.event_name == 'schedule') && needs.repo.outputs.public == 'true')
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["granite-4.0-1b", "qwen3.5-2b", "ministral-3-3b"]') }}
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The runner
        run: |
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)"
          echo "cpu: ${cpu:-unknown}, $(nproc) vCPU"

      - name: Room for a model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: The flagship's release, verified as a stranger would
        run: ./scripts/sources.sh flagship

      - name: The release's own bring-up, from a working copy with the plants at its seams
        run: ./scripts/up.sh flagship

      - name: The suite, by the release's own agent, with the model deciding
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e/e2e-results-flagship-${{ matrix.model }}.json
        run: ./tests/e2e/run.sh flagship "$MODEL"

      - name: One record of the run
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/e2e"
          legs=(out/*/*/leg.json)
          if [ ${#legs[@]} -gt 0 ]; then
            python3 scripts/read.py merge "${legs[@]}" > "$RUNNER_TEMP/e2e/results.json"
          fi
          [ -d out ] && cp -R out "$RUNNER_TEMP/e2e/out"
          ls -l "$RUNNER_TEMP/e2e"

      - name: What the cluster looked like
        if: failure()
        run: |
          export PATH="$PWD/.cache/work/flagship/.cache/bin:$PATH"
          kubectl get pods -A -o wide || true
          tail -n 40 out/flagship/*/own-e2e.log || true
          tail -n 40 out/flagship/*/own-evals.log || true
          kubectl -n agents logs job/evals --tail=20 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-flagship-${{ matrix.model }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  cypress:
    name: The Cypress Cloud triage boundary (${{ matrix.model }})
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.legs == 'all' || inputs.legs == 'cypress'))
      || ((github.event_name == 'push' || github.event_name == 'schedule') && needs.repo.outputs.public == 'true')
    needs: repo
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["granite-4.0-1b", "qwen3.5-2b", "ministral-3-3b"]') }}
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The runner
        run: |
          cpu="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)"
          echo "cpu: ${cpu:-unknown}, $(nproc) vCPU"

      - name: Room for a model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: The release, verified as a stranger would
        run: ./scripts/sources.sh cypress

      - name: The release's own bring-up of its model leg, from a working copy
        run: ./scripts/up.sh cypress

      - name: The suite, by the release's own model harness, one plant at a time
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e/e2e-results-cypress-${{ matrix.model }}.json
        run: ./tests/e2e/run.sh cypress "$MODEL"

      - name: One record of the run
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/e2e"
          legs=(out/*/*/leg.json)
          if [ ${#legs[@]} -gt 0 ]; then
            python3 scripts/read.py merge "${legs[@]}" > "$RUNNER_TEMP/e2e/results.json"
          fi
          [ -d out ] && cp -R out "$RUNNER_TEMP/e2e/out"
          ls -l "$RUNNER_TEMP/e2e"

      - name: What the cluster looked like
        if: failure()
        run: |
          export PATH="$PWD/.cache/work/cypress/.cache/bin:$PATH"
          kubectl get pods -A -o wide || true
          kubectl -n triage-agents get jobs || true
          kubectl -n triage logs deployment/receiver --tail=20 || true
          kubectl -n models logs deployment/llama --tail=20 || true
          tail -n 30 .cache/work/cypress/out/cypress.log || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -30 || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-cypress-${{ matrix.model }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  record:
    name: One record of the run, signed
    # Every leg's results as one file under the run's id, with the legs the
    # run set out to make and did not report named in it. On a public
    # repository it is signed, keyless: the certificate names this workflow,
    # the commit and the run. Signing waits for that because the transparency
    # log is public and would carry a private repository's name. A run that
    # was cancelled makes no record: a signed record of half a run must not
    # exist.
    needs: [repo, calibration, sandbox, flagship, cypress]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every job's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: ${{ runner.temp }}/legs

      - name: One record
        env:
          LEGS_RAN: ${{ toJSON(needs) }}
          LEGS_MODELS: ${{ inputs.models || '["granite-4.0-1b", "qwen3.5-2b", "ministral-3-3b"]' }}
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          python3 scripts/numbers.py record "$RUNNER_TEMP/legs" > "$RUNNER_TEMP/record/run-$GITHUB_RUN_ID.json"
          python3 scripts/numbers.py tables "$RUNNER_TEMP/record/run-$GITHUB_RUN_ID.json" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/record/run-$GITHUB_RUN_ID.json"

      - name: Install the pinned tools
        if: needs.repo.outputs.public == 'true'
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Sign it, keyless, and verify the signature as a stranger would
        if: needs.repo.outputs.public == 'true'
        run: |
          f="$RUNNER_TEMP/record/run-$GITHUB_RUN_ID.json"
          cosign sign-blob --yes "$f" --bundle "$f.sigstore.json"
          cosign verify-blob "$f" --bundle "$f.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/e2e.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Keep the record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-record
          path: ${{ runner.temp }}/record
